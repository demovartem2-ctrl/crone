services:
  - type: web
    name: crone-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crone-db
          property: connectionString
      - key: TOKEN
        sync: false # Токен лучше задать вручную в дашборде Render
databases:
  - name: crone-db
    databaseName: crone
    user: crone_user
    plan: free
